<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1425"><meta name="robots" content="noindex,nofollow,noarchive"><title>ゾロアークを探せ！現地版デモ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;background:#0b1425;color:#f3f7ff}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 0,#203d5b,#0b1425 70%);font-size:16px}
main{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 18px 70px}.eyebrow{color:#90f0d6;letter-spacing:.16em;font-size:11px;font-weight:800}
h1{font-size:30px;margin:8px 0 5px;line-height:1.3}h2{font-size:24px;margin:4px 0 15px}p{line-height:1.75;color:#d0dcf2}
small,.muted{color:#a3b3cd}.shell{padding:22px 19px;border:1px solid #3b536f;border-radius:24px;background:rgba(20,33,55,.96);margin-top:22px;min-height:270px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.status{color:#a1f2df;font-weight:800;font-size:12px}.pill{border:1px solid #486e79;color:#92e1d5;padding:6px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
button{width:100%;min-height:53px;padding:13px 14px;border:0;border-radius:14px;background:#74e8c8;color:#102b34;font-size:16px;font-weight:850;cursor:pointer}
button:disabled{opacity:.45}button.secondary{background:#354b65;color:white}button.outline{background:transparent;border:1px solid #66809f;color:#eaf2ff}.actions{display:grid;gap:11px;margin-top:22px}
label{display:block;margin:18px 0 9px;font-weight:700}select{width:100%;padding:13px;background:#111e33;border:1px solid #65799b;border-radius:12px;color:#fff;font-size:16px}
.count{display:flex;align-items:center;gap:15px}.count button{width:56px}.count strong{font-size:42px;min-width:45px;text-align:center}
.secret{margin:18px 0;padding:23px 13px;border-radius:19px;background:linear-gradient(145deg,#253e5d,#111e32);border:2px solid #5c84a6;text-align:center;min-height:194px}
.secret strong{display:block;font-size:33px;overflow-wrap:anywhere;margin:18px 0}.lock{font-size:52px;margin:15px 0}
.notice{padding:12px 14px;border-radius:13px;background:#402f45;border:1px solid #805c86;font-size:14px;line-height:1.65}
.help{padding:14px;border-radius:12px;background:#112239;line-height:1.65}.timer{font-size:58px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid button{font-size:14px}.dots{display:flex;gap:5px;margin:16px 0}.dots i{flex:1;height:6px;background:#4c5a73;border-radius:8px}.dots i.done{background:#74e8c8}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:15px 0}.choices button{background:#344b65;color:white;min-height:48px;padding:8px 0}.choices button.selected{background:#74e8c8;color:#142d37}
.result{font-size:48px;font-weight:900;text-align:center;padding:20px 0;color:#9ff5db}.footer{text-align:center;color:#869db9;font-size:12px;margin:26px 0 0;line-height:1.8}
</style></head><body>
<main><div class="eyebrow">CA CLOVER · LOCAL DEMO</div><h1>🎭 ゾロアークを探せ！</h1><div class="muted">現地版 / GM専用・認証未接続</div><section class="shell" id="app" aria-live="polite"><p>ゲームを起動しています。表示が変わらない場合は、SafariからWebページとして開いてください。</p></section>
<div class="footer">公開試用版：CA認証なし / 入力情報は保存・送信しません<br>CA Clover本体・DBとは接続しません</div></main>
<script>
"use strict";
(function(){
var pairs=[["デデンネ","エモンガ"],["ロコン","アローラロコン"],["プラスル","マイナン"],["サンド","アローラサンド"],["ニャース","アローラニャース"],["ポニータ","ガラルポニータ"],["ジグザグマ","ガラルジグザグマ"],["ダグトリオ","アローラダグトリオ"]];
var topics=["見た目の特徴をひとつ教えて！","どこで出会いそうなポケモン？","相棒にしたい？ その理由は？","バトルで活躍しそう？","特徴的な部分をひとつ挙げるなら？","進化についてどう思う？"];
var s={phase:"setup",count:6,time:180,index:0,show:false,wolf:0,pair:null,names:[],remaining:180,running:false,deadline:0,topic:0,voted:0,unmasked:false,round:0},tick=null,app=document.getElementById("app");
function r(n){if(window.crypto&&crypto.getRandomValues){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}return Math.floor(Math.random()*n)}
function fmt(t){return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
function btn(label,act,cls){return '<button data-act="'+act+'" class="'+(cls||"")+'">'+label+'</button>'}
function wrap(title,body){app.innerHTML='<div class="top"><span class="status">'+s.phase.toUpperCase()+'</span><span class="pill">ROUND '+(s.round||"準備")+'</span></div><h2>'+title+'</h2>'+body}
function stop(){if(tick){clearInterval(tick);tick=null}s.running=false}
function begin(){stop();s.round++;s.index=0;s.show=false;s.unmasked=false;s.voted=0;s.pair=pairs[r(pairs.length)].slice();if(r(2)===1)s.pair.reverse();s.wolf=r(s.count);s.names=Array.from({length:s.count},function(_,i){return s.pair[i===s.wolf?1:0]});s.remaining=s.time;s.phase="handoff";paint()}
function paint(){var h="",i;
if(s.phase==="setup"){
h='<p>ゲームマスターのスマホを順番に回して、お題を1人ずつ確認します。プレイヤーは自分が少数派かどうか知りません。</p><label>プレイヤー人数（GMは除く）</label><div class="count">'+btn("−","minus","secondary")+'<strong>'+s.count+'</strong>'+btn("＋","plus","secondary")+'</div><small>推奨6〜8人（3〜12人対応）</small><label>トークタイム</label><select id="duration"><option value="120">2分</option><option value="180">3分</option><option value="300">5分</option><option value="0">制限なし</option></select><p>会話は自由。嘘やブラフもOK！ 最後は指差し投票です。</p><div class="actions">'+btn("ゲームを開始","begin")+'</div>';
wrap("ゲームを準備する",h);document.getElementById("duration").value=String(s.time);return
}
if(s.phase==="handoff"){
var dots='<div class="dots">';for(i=0;i<s.count;i++)dots+='<i class="'+(i<s.index?"done":"")+'"></i>';dots+='</div>';
h=dots+'<div class="notice">⚠️ プレイヤー'+(s.index+1)+'だけが画面を見てください。次の人には、必ずお題を隠してから渡してください。</div><div class="secret"><small>秘密のお題</small>'+(s.show?'<strong>'+s.names[s.index]+'</strong><p>名前を出さずに話そう。嘘もOK！</p>':'<div class="lock">🔒</div><small>本人だけがお題を開いてください</small>')+'</div><div class="actions">'+(s.show?btn("確認した・お題を隠す","next"):btn("自分のお題を見る","show"))+btn("最初からやり直す","reset","outline")+'</div>';
wrap("プレイヤー "+(s.index+1)+" / "+s.count,h);return
}
if(s.phase==="talk"){
h='<p>順番に話すのも、フリートークも自由。意図的な嘘もOKです。</p><div class="timer" id="timer">'+(s.time?fmt(s.remaining):"∞")+'</div><div class="grid">'+btn(s.time?(s.running?"⏸ 停止":"▶ 開始"):"制限なし","timerToggle","secondary")+btn("🎤 話題を変える","topic","outline")+'</div><label>トーク補助</label><div class="help">'+topics[s.topic]+'</div><div class="actions">'+btn("投票へ進む","vote")+'</div>';
wrap("会話で探り合おう！",h);return
}
if(s.phase==="vote"){
h='<p>「せーの！」でゾロアークだと思う人を指差し。最多得票者をGMが選択してください。</p><div class="help">同票最多の場合は、決選投票をして1名を決める運用にしています。</div><label>最多得票のプレイヤー</label><div class="choices">';
for(i=0;i<s.count;i++)h+='<button class="'+(s.voted===i+1?"selected":"")+'" data-act="select" data-id="'+(i+1)+'">'+(i+1)+'番</button>';
h+='</div><div class="actions">'+btn("判定画面へ","result") + btn("トークに戻る","back","outline")+'</div>';
wrap("ゾロアークは誰だ？",h);return
}
if(s.phase==="result"){
h=s.unmasked?'<div class="result">🦊 '+(s.wolf+1)+'番</div><p>多数派のお題：<strong>'+s.pair[0]+'</strong><br>少数派のお題：<strong>'+s.pair[1]+'</strong></p><div class="help">'+(s.voted===s.wolf+1?"🎉 多数派の勝ち！":"🎭 ゾロアークの勝ち！")+'</div><div class="actions">'+btn("次のゲームへ","again")+btn("人数設定に戻る","reset","outline")+'</div>':'<div class="secret"><div class="lock">🎭</div>全員の準備ができたら正体を公開！</div><div class="actions">'+btn("🦊 正体を公開する","unmask")+'</div>';
wrap("正体発表！",h);return
}}
document.addEventListener("click",function(ev){var el=ev.target.closest("button[data-act]");if(!el)return;var a=el.getAttribute("data-act");
if(a==="plus"){s.count=Math.min(12,s.count+1);paint()}
if(a==="minus"){s.count=Math.max(3,s.count-1);paint()}
if(a==="begin"||a==="again")begin();
if(a==="reset"){stop();s.phase="setup";paint()}
if(a==="show"){s.show=true;paint()}
if(a==="next"){s.show=false;s.index++;if(s.index===s.count){s.phase="talk";s.topic=r(topics.length)}paint()}
if(a==="topic"){s.topic=(s.topic+1+r(topics.length-1))%topics.length;paint()}
if(a==="timerToggle"&&s.time){if(s.running){s.remaining=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));stop();paint()}else{s.deadline=Date.now()+s.remaining*1000;s.running=true;tick=setInterval(function(){s.remaining=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));var d=document.getElementById("timer");if(d)d.textContent=fmt(s.remaining);if(s.remaining===0){stop();paint()}},200);paint()}}
if(a==="vote"){stop();s.phase="vote";paint()}
if(a==="back"){s.phase="talk";paint()}
if(a==="select"){s.voted=Number(el.getAttribute("data-id"));paint()}
if(a==="result"){if(!s.voted){alert("最多得票者を選択してください");return}s.phase="result";paint()}
if(a==="unmask"){s.unmasked=true;paint()}
});
document.addEventListener("change",function(ev){if(ev.target.id==="duration")s.time=Number(ev.target.value)});
paint();
})();
</script></body></html>
