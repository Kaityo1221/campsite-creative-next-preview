var topics=["色や形から連想する特徴は？","どんな場所にいそう？","このポケモンと旅するなら？","進化はすると思う？","ほかのポケモンと比べると？","強そうな技を使いそう？","Pokémon GOではどんな印象？","好きなところを一つ教えて！","初めて見たときの印象は？","相棒にしたい？","バトルに向いていそう？","一言で説明すると？"];
function readRecent(){try{var v=JSON.parse(sessionStorage.getItem("zoroark_recent_v2")||"[]");return Array.isArray(v)?v.filter(function(x){return typeof x==="string"}).slice(-6):[]}catch(e){return []}}

var s={phase:"setup",count:6,time:180,index:0,show:false,wolf:0,pair:null,names:[],remaining:180,running:false,deadline:0,topic:0,voted:0,unmasked:false,round:0,level:"all",mode:"自由トーク",talkRound:1,history:readRecent(),pairMeta:null},tick=null,app=document.getElementById("app");

function begin(){stop();s.round++;s.index=0;s.show=false;s.unmasked=false;s.voted=0;s.talkRound=1;

var fresh=eligible.filter(function(p){return s.history.indexOf(p.id)===-1});
if(fresh.length===0)fresh=eligible;

function paint(){var h="",i;
if(s.phase==="setup"){

}

document.addEventListener("click",function(ev){var el=ev.target.closest("button[data-act]");if(!el)return;var a=el.getAttribute("data-act");
