name: Publish Creative Next iPhone preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: creative-next-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch Creative Next feature branch (public source)
        run: |
          git clone --depth 1 --branch feature/creative-next-kmz-phase1b-20261009 https://github.com/Kaityo1221/Campsite-Design-Tool-JP.git source
      - name: Prepare isolated static preview
        run: |
          mkdir -p _site
          cp -R source/creative-next/phase-2-preview/. _site/
          test -f _site/index.html
          test -f _site/preview.mjs
          test -f _site/preview.css
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
