name: Publish Creative Next iPhone preview
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh iPhone preview after Leaflet Canvas visibility + Safari CSS cache fix (Creative Next f09f9c9d, 2026-10-10).
permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write
concurrency:
  group: creative-next-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
