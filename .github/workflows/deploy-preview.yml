name: Publish Creative Next iPhone preview
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh iPhone preview after Leaflet Canvas visibility + Safari CSS cache fix (Creative Next f09f9c9d, 2026-10-10).
permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write
concurrency:
  group: creative-next-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch Creative Next feature branch (public source)
        run: |
          git clone --depth 1 --branch feature/creative-next-kmz-phase1b-20261009 https://github.com/Kaityo1221/Campsite-Design-Tool-JP.git source
          # Pin already tested versions. A new audit build must not silently
          # replace the JavaScript at an older smoke-test URL.
          git -C source fetch --depth 1 origin 7d9628b25ff23b30f245f9e2e6f81ec647562a60
          git -C source worktree add --detach ../source-r9 7d9628b25ff23b30f245f9e2e6f81ec647562a60
          git -C source fetch --depth 1 origin 7abdbf0d8e7cc52baa19c49db5bda063d22b089d
          git -C source worktree add --detach ../source-r10 7abdbf0d8e7cc52baa19c49db5bda063d22b089d
          git -C source fetch --depth 1 origin bde901f4264a7d788b271038884ee5a6669b2964
          git -C source worktree add --detach ../source-r11 bde901f4264a7d788b271038884ee5a6669b2964
          # Pin the exact r12 revision last deployed on 2026-10-10 08:06Z.
          git -C source fetch --depth 1 origin 488c2c21b054dd084fd80b98e7911f3e0c735f59
          git -C source worktree add --detach ../source-r12 488c2c21b054dd084fd80b98e7911f3e0c735f59
          # Newly verified r13 is immutable across future preview deployments.
          git -C source fetch --depth 1 origin a1dcd68782de1cdfbc9bb162d0ac4b3a1f2a6639
          git -C source worktree add --detach ../source-r13 a1dcd68782de1cdfbc9bb162d0ac4b3a1f2a6639
          # Pin the first iPhone 90%-B layout build; do not mutate r13.
          git -C source fetch --depth 1 origin e3e482634e7d40510aab16a5ec4622c44b9bb868
          git -C source worktree add --detach ../source-r14 e3e482634e7d40510aab16a5ec4622c44b9bb868
          # r15 Map First UI rehearsal, source-pinned and independent from r9-r14.
          git -C source fetch --depth 1 origin b7dff6e07f6133dc133902c2a0f95bc1a5269b38
          git -C source worktree add --detach ../source-map-u2 b7dff6e07f6133dc133902c2a0f95bc1a5269b38
          # r16: generate visual-only source from exact production patch chain, never execute old storage logic.
          git -C source fetch --depth 1 origin fe1877aa6d97793842f178c071eb65c97d1a4a59
          git -C source worktree add --detach ../source-exact-r16 fe1877aa6d97793842f178c071eb65c97d1a4a59
          # r17: original UI DOM/CSS, isolated Undo/Redo test only.
          git -C source fetch --depth 1 origin 7c6d44f9e9b3b9ab259d5d004dcbbc8b3383d890
          git -C source worktree add --detach ../source-original-r17 7c6d44f9e9b3b9ab259d5d004dcbbc8b3383d890
          git -C source fetch --depth 1 origin 8c92daacb5e6b513f29ba64866661a34eeb7ada9
          git -C source worktree add --detach ../source-original-r18 8c92daacb5e6b513f29ba64866661a34eeb7ada9
          # r19 original UI picker, explicit review, isolated editor only.
          git -C source fetch --depth 1 origin 8861731c4fb28a808b4c43ca6b446f790e7a6cbf
          git -C source worktree add --detach ../source-original-r19 8861731c4fb28a808b4c43ca6b446f790e7a6cbf
      - name: Fetch isolated r20
        run: |
          git clone --depth 1 --branch feature/creative-next-ui-exact-parity-20261010 https://github.com/Kaityo1221/Campsite-Design-Tool-JP.git source-r20
          git -C source-r20 fetch --depth 1 origin 84782ec579ed7459690cd4c28db877a0f903d511
          git -C source-r20 checkout 84782ec579ed7459690cd4c28db877a0f903d511
      - name: Fetch native file input Safari fix
        run: |
          git clone --depth 1 --branch feature/creative-next-ui-exact-parity-20261010 https://github.com/Kaityo1221/Campsite-Design-Tool-JP.git source-r21
          git -C source-r21 fetch --depth 1 origin 546cbfec01a920bd63752b4c8e19719e0075a585
          git -C source-r21 checkout 546cbfec01a920bd63752b4c8e19719e0075a585
      - name: Prepare isolated static preview
        run: |
          mkdir -p _site
          # Preserve the unversioned root at its previous tested source, too.
          cp -R source-r12/creative-next/phase-1a _site/phase-1a
          cp -R source-r12/creative-next/phase-1b _site/phase-1b
          cp -R source-r12/creative-next/phase-2-preview _site/phase-2-preview
          # Versioned, isolated URL for an iPhone smoke test without reusing cached modules.
          mkdir -p _site/roundtrip-fix-r9
          cp -R source-r9/creative-next/phase-1a _site/roundtrip-fix-r9/phase-1a
          cp -R source-r9/creative-next/phase-1b _site/roundtrip-fix-r9/phase-1b
          cp -R source-r9/creative-next/phase-2-preview _site/roundtrip-fix-r9/phase-2-preview
          # Keep legacy and r9 previews intact; r10 uses a distinct
          # localStorage and IndexedDB namespace selected by URL path.
          mkdir -p _site/save-isolated-r10
          cp -R source-r10/creative-next/phase-1a _site/save-isolated-r10/phase-1a
          cp -R source-r10/creative-next/phase-1b _site/save-isolated-r10/phase-1b
          cp -R source-r10/creative-next/phase-2-preview _site/save-isolated-r10/phase-2-preview
          # New r11: report-only legacy compatibility diagnosis, own save space.
          mkdir -p _site/legacy-audit-r11
          cp -R source-r11/creative-next/phase-1a _site/legacy-audit-r11/phase-1a
          cp -R source-r11/creative-next/phase-1b _site/legacy-audit-r11/phase-1b
          cp -R source-r11/creative-next/phase-2-preview _site/legacy-audit-r11/phase-2-preview
          # r12 is winding-compatible but still fail-closed on missing owners.
          mkdir -p _site/legacy-winding-r12
          cp -R source-r12/creative-next/phase-1a _site/legacy-winding-r12/phase-1a
          cp -R source-r12/creative-next/phase-1b _site/legacy-winding-r12/phase-1b
          cp -R source-r12/creative-next/phase-2-preview _site/legacy-winding-r12/phase-2-preview
          # r13 adds synthetic-only iPhone safety diagnostics in a fresh workspace.
          mkdir -p _site/iphone-safety-r13
          cp -R source-r13/creative-next/phase-1a _site/iphone-safety-r13/phase-1a
          cp -R source-r13/creative-next/phase-1b _site/iphone-safety-r13/phase-1b
          cp -R source-r13/creative-next/phase-2-preview _site/iphone-safety-r13/phase-2-preview
          # r14 iPhone UI-only test: own URL and storage namespace; r9-r13 remain pinned.
          mkdir -p _site/iphone-ui-r14
          cp -R source-r14/creative-next/phase-1a _site/iphone-ui-r14/phase-1a
          cp -R source-r14/creative-next/phase-1b _site/iphone-ui-r14/phase-1b
          cp -R source-r14/creative-next/phase-2-preview _site/iphone-ui-r14/phase-2-preview
          mkdir -p _site/map-ui-r15
          cp -R source-map-u2/creative-next/map-ui-preview/. _site/map-ui-r15/
          # r16 is a STATIC, DISABLED-control snapshot for PO visual comparison only.
          node source-exact-r16/creative-next/qa/build-original-ui-snapshot.cjs
          mkdir -p _site/original-ui-r16/runtime _site/original-ui-r16/assets
          cp source-exact-r16/creative-next/exact-ui-snapshot/index.html _site/original-ui-r16/runtime/index.html
          cp source-exact-r16/assets/creative-mode-opening-final.webp _site/original-ui-r16/assets/creative-mode-opening-final.webp
          cp source-exact-r16/assets/creative-mode-start-transition.webp _site/original-ui-r16/assets/creative-mode-start-transition.webp
          node source-original-r17/creative-next/qa/build-original-ui-snapshot.cjs
          mkdir -p _site/original-ui-r17/original-ui-r17 _site/original-ui-r17/assets _site/original-ui-r17/integration
          cp source-original-r17/creative-next/original-ui-r17/index.html _site/original-ui-r17/original-ui-r17/index.html
          cp source-original-r17/creative-next/original-ui-r17/r17-undo-redo.mjs _site/original-ui-r17/original-ui-r17/r17-undo-redo.mjs
          cp source-original-r17/creative-next/integration/{original-ui-buttons-fixture,exclusive-creative-control,creative-next-command-boundary}.mjs _site/original-ui-r17/integration/
          cp source-original-r17/assets/creative-mode-opening-final.webp _site/original-ui-r17/assets/creative-mode-opening-final.webp
          cp source-original-r17/assets/creative-mode-start-transition.webp _site/original-ui-r17/assets/creative-mode-start-transition.webp
          node source-original-r18/creative-next/qa/build-original-ui-snapshot.cjs
          mkdir -p _site/original-ui-r18/original-ui-r18 _site/original-ui-r18/assets
          cp source-original-r18/creative-next/original-ui-r18/index.html _site/original-ui-r18/original-ui-r18/index.html
          cp source-original-r18/creative-next/original-ui-r18/r18-real-engine.mjs _site/original-ui-r18/original-ui-r18/r18-real-engine.mjs
          cp -R source-original-r18/creative-next/integration _site/original-ui-r18/integration
          cp -R source-original-r18/creative-next/phase-1b _site/original-ui-r18/phase-1b
          cp source-original-r18/assets/creative-mode-opening-final.webp _site/original-ui-r18/assets/creative-mode-opening-final.webp
          cp source-original-r18/assets/creative-mode-start-transition.webp _site/original-ui-r18/assets/creative-mode-start-transition.webp
          node source-original-r19/creative-next/qa/build-original-ui-snapshot.cjs
          mkdir -p _site/original-ui-r19/original-ui-r19 _site/original-ui-r19/assets
          cp source-original-r19/creative-next/original-ui-r19/index.html _site/original-ui-r19/original-ui-r19/index.html
          cp source-original-r19/creative-next/original-ui-r19/r19-file-review.mjs _site/original-ui-r19/original-ui-r19/r19-file-review.mjs
          cp -R source-original-r19/creative-next/integration _site/original-ui-r19/integration
          cp -R source-original-r19/creative-next/phase-1b _site/original-ui-r19/phase-1b
          cp source-original-r19/assets/creative-mode-opening-final.webp _site/original-ui-r19/assets/creative-mode-opening-final.webp
          cp source-original-r19/assets/creative-mode-start-transition.webp _site/original-ui-r19/assets/creative-mode-start-transition.webp
          node source-r20/creative-next/qa/build-original-ui-snapshot.cjs
          mkdir -p _site/original-ui-r20/original-ui-r20 _site/original-ui-r20/assets
          cp source-r20/creative-next/original-ui-r20/index.html _site/original-ui-r20/original-ui-r20/index.html
          cp source-r20/creative-next/original-ui-r20/r20-readonly-map.mjs _site/original-ui-r20/original-ui-r20/r20-readonly-map.mjs
          cp -R source-r20/creative-next/integration _site/original-ui-r20/integration
          cp -R source-r20/creative-next/phase-1b _site/original-ui-r20/phase-1b
          cp source-r20/assets/creative-mode-opening-final.webp _site/original-ui-r20/assets/creative-mode-opening-final.webp
          node source-r21/creative-next/qa/build-original-ui-snapshot.cjs
          mkdir -p _site/original-ui-r21/original-ui-r20 _site/original-ui-r21/assets
          cp source-r21/creative-next/original-ui-r20/index.html _site/original-ui-r21/original-ui-r20/index.html
          cp source-r21/creative-next/original-ui-r20/r20-readonly-map.mjs _site/original-ui-r21/original-ui-r20/r20-readonly-map.mjs
          cp -R source-r21/creative-next/integration _site/original-ui-r21/integration
          cp -R source-r21/creative-next/phase-1b _site/original-ui-r21/phase-1b
          cp source-r21/assets/creative-mode-opening-final.webp _site/original-ui-r21/assets/creative-mode-opening-final.webp
          # GitHub Pages may serve .mjs with an unsupported MIME type on iOS.
          # Publish module files as .js and update every local import reference.
          python3 - <<'PY'
          from pathlib import Path
          root = Path('_site')
          modules = list(root.rglob('*.mjs'))
          for path in modules:
              body = path.read_text(encoding='utf-8')
              path.with_suffix('.js').write_text(body.replace('.mjs', '.js'), encoding='utf-8')
              path.unlink()
          for path in root.rglob('*.html'):
              body = path.read_text(encoding='utf-8')
              path.write_text(body.replace('.mjs', '.js'), encoding='utf-8')
          PY
          printf '%s\n' '<!doctype html><html lang="ja"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./phase-2-preview/index.html"><title>Creative Next Preview</title><a href="./phase-2-preview/index.html">Creative Nextを開く</a></html>' > _site/index.html
          test -f _site/phase-2-preview/index.html
          test -f _site/phase-2-preview/preview.js
          test -f _site/phase-1a/core/poi-store.js
          test -f _site/phase-1b/integration/isolated-editor-session.js
          test -f _site/roundtrip-fix-r9/phase-2-preview/preview.js
          test -f _site/roundtrip-fix-r9/phase-1b/core/activity-areas.js
          test -f _site/save-isolated-r10/phase-2-preview/workspace-namespace.js
          test -f _site/save-isolated-r10/phase-2-preview/preview.js
          test -f _site/save-isolated-r10/phase-1b/core/journal-save.js
          test -f _site/legacy-audit-r11/phase-1b/core/legacy-shape-audit.js
          test -f _site/legacy-audit-r11/phase-2-preview/workspace-namespace.js
          test -f _site/legacy-audit-r11/phase-2-preview/preview.js
          test -f _site/legacy-winding-r12/phase-1b/core/stage-kmz.js
          test -f _site/legacy-winding-r12/phase-1b/core/legacy-shape-audit.js
          test -f _site/legacy-winding-r12/phase-2-preview/workspace-namespace.js
          test -f _site/legacy-winding-r12/phase-2-preview/preview.js
          test -f _site/iphone-safety-r13/phase-2-preview/iphone-safety-lab.html
          test -f _site/iphone-safety-r13/phase-2-preview/iphone-safety-lab.js
          test -f _site/iphone-safety-r13/phase-2-preview/workspace-namespace.js
          test -f _site/iphone-safety-r13/phase-1b/core/journal-save.js
          test -f _site/iphone-ui-r14/phase-2-preview/index.html
          test -f _site/iphone-ui-r14/phase-2-preview/preview.js
          test -f _site/iphone-ui-r14/phase-2-preview/workspace-namespace.js
          test -f _site/iphone-ui-r14/phase-1b/core/journal-save.js
          test -f _site/map-ui-r15/index.html
          test -f _site/map-ui-r15/ui.js
          test -f _site/map-ui-r15/ui.css
          test -f _site/map-ui-r15/assets/pokestop.png
          test -f _site/map-ui-r15/assets/gym.png
          test -f _site/map-ui-r15/assets/powerspot.png
          test -s _site/original-ui-r16/runtime/index.html
          test -s _site/original-ui-r16/assets/creative-mode-opening-final.webp
          test -s _site/original-ui-r17/original-ui-r17/index.html
          test -s _site/original-ui-r17/integration/original-ui-buttons-fixture.js
          test -s _site/original-ui-r18/original-ui-r18/index.html
          test -s _site/original-ui-r18/phase-1b/integration/isolated-editor-session.js
          test -s _site/original-ui-r19/original-ui-r19/index.html
          test -s _site/original-ui-r19/integration/original-file-review.js
          test -s _site/original-ui-r20/original-ui-r20/index.html
          test -s _site/original-ui-r21/original-ui-r20/index.html
          if grep -iq '<script' _site/original-ui-r16/runtime/index.html; then exit 1; fi
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report isolated preview deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            STATE=success
            DESC="Versioned Creative Next isolated iPhone preview published"
          else
            STATE=failure
            DESC="Versioned Creative Next isolated iPhone preview not published"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context="creative-next/isolated-pages" -f description="$DESC"
