      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published r31 iPhone preview files over HTTPS
        if: steps.deployment.outcome == 'success'
        run: |
          ROOT="${{ steps.deployment.outputs.page_url }}iphone-review-r31-7"
          for name in creative-next/original-ui-r31-b3-b4/index.html creative-next/original-ui-r31-b3-b4/bootstrap.mjs creative-next/original-ui-r31-b3-b4/adapter-review.mjs creative-next/phase-2-preview/vendor/jszip.min.js; do
            curl -fLsS --retry 8 --retry-delay 3 -o /tmp/r31-preview-verify "$ROOT/$name"
            test -s /tmp/r31-preview-verify
          done
          echo "R31_PREVIEW_HTTP_PASS $ROOT/creative-next/original-ui-r31-b3-b4/index.html"
      - name: Verify new r31 8-9 preview over HTTPS
        if: steps.deployment.outcome == 'success'
        run: |
          ROOT="${{ steps.deployment.outputs.page_url }}iphone-review-r31-8-9"
          for name in creative-next/original-ui-r31-b3-b4/index.html creative-next/original-ui-r31-b3-b4/bootstrap.mjs creative-next/original-ui-r31-b3-b4/ui-runtime.mjs creative-next/original-ui-r31-b3-b4/workspace.mjs creative-next/phase-2-preview/vendor/jszip.min.js; do
            curl -fLsS --retry 8 --retry-delay 3 -o /tmp/r31-preview-89-verify "$ROOT/$name"
            test -s /tmp/r31-preview-89-verify
          done
          curl -fLsS --retry 8 --retry-delay 3 "$ROOT/creative-next/original-ui-r31-b3-b4/workspace.mjs" | grep -q "campsite-creative-next-v1-r31-review-8-9"
          echo "R31_8_9_PREVIEW_HTTP_PASS $ROOT/creative-next/original-ui-r31-b3-b4/index.html"
      - name: Verify new r31 10 preview over HTTPS
        if: steps.deployment.outcome == 'success'
        run: |
          ROOT="${{ steps.deployment.outputs.page_url }}iphone-review-r31-10"
          for name in creative-next/original-ui-r31-b3-b4/index.html creative-next/original-ui-r31-b3-b4/bootstrap.mjs creative-next/original-ui-r31-b3-b4/ui-runtime.mjs creative-next/original-ui-r31-b3-b4/workspace.mjs creative-next/phase-2-preview/vendor/jszip.min.js; do
            curl -fLsS --retry 8 --retry-delay 3 -o /tmp/r31-preview-10-verify "$ROOT/$name"
            test -s /tmp/r31-preview-10-verify
          done
          curl -fLsS --retry 8 --retry-delay 3 "$ROOT/creative-next/original-ui-r31-b3-b4/workspace.mjs" | grep -q "campsite-creative-next-v1-r31-review-10"
          curl -fLsS --retry 8 --retry-delay 3 "$ROOT/creative-next/original-ui-r31-b3-b4/bootstrap.mjs" | grep -q "onSwitchFile"
          echo "R31_10_PREVIEW_HTTP_PASS $ROOT/creative-next/original-ui-r31-b3-b4/index.html"
      - name: Report isolated preview deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            STATE=success
            DESC="Versioned Creative Next isolated iPhone preview published"
          else
            STATE=failure
            DESC="Versioned Creative Next isolated iPhone preview not published"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context="creative-next/isolated-pages" -f description="$DESC"
